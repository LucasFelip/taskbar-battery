name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test, build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: test
        run: cargo test --locked

      - name: build (release)
        run: cargo build --release --locked

      - name: smoke test (sem hardware)
        shell: cmd
        run: |
          target\release\taskbar-battery.exe --version
          target\release\taskbar-battery.exe --once --fake 42 | findstr /C:"42%"

      - name: tamanho do executável
        shell: pwsh
        run: |
          $f = Get-Item target\release\taskbar-battery.exe
          "taskbar-battery.exe: $([math]::Round($f.Length/1KB)) KB" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: taskbar-battery-windows-x64
          path: target/release/taskbar-battery.exe
          if-no-files-found: error
          retention-days: 14