[package]
name = "taskbar-battery"
version = "0.1.0"
edition = "2024"
description = "Bateria dos periféricos (mouse, teclado, fone, celular) na bandeja do Windows 11, com consumo mínimo"
license = "MIT"
readme = "README.md"
rust-version = "1.88"

[dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Devices_Properties", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_UI_HiDpi", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_Devices_HumanInterfaceDevice", "Win32_Security"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
